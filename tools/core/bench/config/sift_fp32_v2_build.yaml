# SIFT-128 FP32; measured build chain for the 2026-11-03 campaign in ../TESTING.zh-CN.md.
# Build the base graph first, then derive v1/v2 from the same raw snapshot.
# ./build/bin/local_builder tools/core/bench/config/sift_fp32_v2_build.yaml
BuilderCommon:
  BuilderClass: HnswStreamer
  DumpFormat: streamer
  DumpPath: /data/sift/sift-v2.index
  InputIndex: /data/sift/sift-raw.index
  LogLevel: info
  ThreadCount: 4
QuantizedGraph:
  Codec:
    Type: native
  MaxNeighbors: 64
  Persist: true
  RotationViews: 2
  ThreadCount: 4
QuantizedGraphRouter:
  Anchors: 65536
  ProjectedDimension: 64
  Seed: 202610261259
