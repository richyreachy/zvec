# SIFT strict ID Recall@10 >= 90% preset selected by the measured campaign.
# Build sift_fp32_base_build.yaml, then the matching v1/v2 snapshot below.
# Rebuilt graphs require recall calibration. See ../TESTING.zh-CN.md.
IndexCommon:
  IndexConfig: '{"index_type":"kHNSW","data_type":"DT_FP32","metric_type":"kL2sq","dimension":128,"m":32,"ef_construction":400,"use_id_map":true,"use_quantized_graph":true,"quantizer_param":{"type":"kNone"}}'
  IndexPath: /data/sift/sift-v2.index
  TopK: 10
  QueryFile: /data/sift/queries.txt
  QueryFirstSep: ;
  QuerySecondSep: ' '
  QueryType: float
  RetrievalMode: dense
  FilterMode: none
  GroundTruthFile: /data/sift/neighbors.txt
  GroundTruthFirstSep: ;
  GroundTruthSecondSep: ' '
  CompareById: true
  RecallThreadCount: 1
  RecallBatchCount: 0
  RecallGTCount: 10
  RecallLogDir: /data/sift/fp32_recall_logs
  BenchThreadCount: 1
  BenchThreadCounts:
  - 1
  BenchRounds: 5
  BenchSecs: 6
  BenchBatchCount: 1
  BenchIterCount: 1000000000
  LogLevel: info
QueryConfig:
  QueryParam: '{"index_type":"kHNSW","ef_search":128,"quantized_graph_margin":0.008,"quantized_graph_max_expansions":48,"quantized_graph_bucket_width":0.002,"quantized_graph_route_beam":1,"quantized_graph_uncertainty_bonus":0}'
