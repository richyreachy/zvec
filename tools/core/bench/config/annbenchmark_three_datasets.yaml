# Measurement manifest for the three-dataset ANN-Benchmarks campaign.
# This describes the run and selected parameters; it is not a local_builder input.
Protocol:
  TaskParallelism: 2
  QueryParallelism: 1
  QueryCpu: 0
  BuildCpuSlots:
  - - 0
    - 2
    - 4
    - 6
  - - 8
    - 10
    - 12
    - 14
  BuildOmpThreads: 4
  TopK: 10
  Trials: 5
  TrialSelection: median
  WarmupPasses: 1
  AnnAbsoluteDistanceTolerance: 0.001
  TuningQueries: same full query set used for reporting
Datasets:
  sift:
    path: $ANN_BENCHMARKS_ROOT/data/sift-128-euclidean.hdf5
    train:
    - 1000000
    - 128
    test:
    - 10000
    - 128
    dtype: float32
    metric: euclidean
    groundtruth_distance_max_abs_error_20_queries: 0.0
    size_bytes: 525128288
  gist:
    path: $ANN_BENCHMARKS_ROOT/data/gist-960-euclidean.hdf5
    train:
    - 1000000
    - 960
    test:
    - 1000
    - 960
    dtype: float32
    metric: euclidean
    groundtruth_distance_max_abs_error_20_queries: 1.1920928955078125e-07
    size_bytes: 3844648288
  glove:
    path: $DATASET_ROOT/glove/glove-100-angular.hdf5
    train:
    - 1183514
    - 100
    test:
    - 10000
    - 100
    dtype: float32
    metric: angular
    groundtruth_distance_max_abs_error_20_queries: 1.7881393432617188e-07
    size_bytes: 485413888
