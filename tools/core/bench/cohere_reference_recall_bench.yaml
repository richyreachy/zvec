# Cohere original frozen 1M graph: final bucket90_w16 comparison preset.
# This uses the matched external C++ router, not a newly trained replacement.
# Copy the archived graph/model pair to the paths below before use.
# For a new embedded-router build, use cohere_build.yaml and
# cohere_recall_bench.yaml instead. See TESTING.zh-CN.md for provenance.
# Run recall before bench; both tools accept this file.
IndexCommon:
  IndexConfig: >-
    {"index_type":"kHNSW","data_type":"DT_FP32",
     "metric_type":"kCosine","dimension":768,
     "m":50,"ef_construction":500,
     "use_id_map":true,"use_quantized_graph":true,
     "quantized_graph_model":"/data/cohere/router384_snapshot_final.bin"}
  IndexPath: /data/cohere/cohere1m_m50_efc500.index
  TopK: 10
  QueryFile: /data/cohere/cohere_test_vector_1m.1000.new.txt
  QueryFirstSep: ";"
  QuerySecondSep: " "
  QueryType: float
  RetrievalMode: dense
  FilterMode: none

  GroundTruthFile: /data/cohere/neighbors.txt
  GroundTruthFirstSep: ";"
  GroundTruthSecondSep: " "
  CompareById: true
  RecallThreadCount: 1
  RecallBatchCount: 0
  RecallGTCount: 10
  RecallLogDir: /data/cohere/reference_recall_logs

  BenchThreadCount: 1
  BenchThreadCounts: [1, 8]
  BenchRounds: 3
  BenchSecs: 6
  BenchBatchCount: 1
  BenchIterCount: 1000000000
  LogLevel: info

# QueryParam is a JSON string. Do not add QueryParams unless intentionally
# running a sweep: that list overrides the single configuration below.
# route_beam=1 uses the matched external router; it does not train one.
QueryConfig:
  QueryParam: >-
    {"index_type":"kHNSW","ef_search":64,
     "quantized_graph_margin":0.002,
     "quantized_graph_bucket_width":0.004,
     "quantized_graph_max_expansions":64,
     "quantized_graph_route_beam":1,
     "quantized_graph_uncertainty_bonus":0.15}
