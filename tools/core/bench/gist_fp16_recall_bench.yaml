# Uses the embedded codec trained by the matching build YAML.
# GIST 1M: FP16 storage with FP32 input and refinement.
# See FP16.zh-CN.md. Use gist_fp16_build.yaml to build a new snapshot.
# Validate recall on the newly trained snapshot before measuring QPS.
# ./build/bin/recall tools/core/bench/gist_fp16_recall_bench.yaml
# ./build/bin/bench tools/core/bench/gist_fp16_recall_bench.yaml
IndexCommon:
  IndexConfig: >-
    {"index_type":"kHNSW","data_type":"DT_FP32",
     "metric_type":"kL2sq","dimension":960,
     "m":50,"ef_construction":500,
     "use_id_map":true,"use_quantized_graph":true,
     "quantizer_param":{"type":"kFP16"}}
  IndexPath: /data/gist/gist_fp16_full.index
  TopK: 10
  QueryFile: /data/gist/gist_queries.txt
  QueryFirstSep: ";"
  QuerySecondSep: " "
  QueryType: float
  RetrievalMode: dense
  FilterMode: none

  GroundTruthFile: /data/gist/gist_neighbors.txt
  GroundTruthFirstSep: ";"
  GroundTruthSecondSep: " "
  CompareById: true
  RecallThreadCount: 1
  RecallBatchCount: 0
  RecallGTCount: 10
  RecallLogDir: /data/gist/fp16_recall_logs

  BenchThreadCount: 1
  BenchThreadCounts: [1, 8]
  BenchRounds: 5
  BenchSecs: 6
  BenchBatchCount: 1
  BenchIterCount: 1000000000
  LogLevel: info

# QueryParam is a JSON string. Do not add QueryParams unless intentionally
# running a sweep: that list overrides the single configuration below.
# route_beam=1 uses the embedded router; it does not train a missing router.
QueryConfig:
  QueryParam: >-
    {"index_type":"kHNSW","ef_search":2048,
     "quantized_graph_margin":0.0485,
     "quantized_graph_bucket_width":0.002,
     "quantized_graph_max_expansions":256,
     "quantized_graph_route_beam":1,
     "quantized_graph_uncertainty_bonus":0.0}
