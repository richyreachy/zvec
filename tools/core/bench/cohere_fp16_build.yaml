# Cohere 1M: FP32 input, FP16 database storage, embedded SymQG router.
# See FP16.zh-CN.md. Use NEW paths; existing FP32 snapshots are not converted.
# ./build/bin/local_builder tools/core/bench/cohere_fp16_build.yaml
BuilderCommon:
  BuilderClass: HnswStreamer
  QuantizerName: Fp16Quantizer
  BuildFile: /data/cohere/cohere_train_vector_1m.new.zvec.vecs
  MetricName: Cosine
  IndexPath: /data/cohere/cohere_fp16_work.index
  DumpPath: /data/cohere/cohere_fp16_full.index
  DumpFormat: streamer
  MaxDocs: 1000000
  ThreadCount: 8
  LogLevel: info

BuilderParams:
  proxima.hnsw.streamer.max_neighbor_count: !!int 50
  proxima.hnsw.streamer.efconstruction: !!int 500
  proxima.hnsw.streamer.get_vector_enable: !!bool true

# Train from database vectors and embed the router in the dumped snapshot.
# 384 is the entry-routing projection; the indexed vectors remain 768-D (stored as FP16).
# A successful build logs: Router trained for embedded snapshot
QuantizedGraphRouter:
  Anchors: 65536
  ProjectedDimension: 384
  Seed: 202610261259

# L2 HNSW construction uses FP32 accumulation; cosine construction uses the
# existing Fp16Quantizer dispatch. SymQG search/refinement always uses FP32.
QuantizerParams:
  fp32_accumulation: true

# Train the codec from this graph and persist both parameters and encoded blocks.
# No external model file or query/ground-truth data is needed.
QuantizedGraph:
  Persist: true
  MaxNeighbors: 32
  ThreadCount: 8
  Codec:
    Type: global
    BlockDimension: 6
    Codebook: hadamard
    TrainingSamples: 1024
    CenterWeight: 0.5
    Seed: 20261031
