# Cohere 1M, cosine, Top10: starting configuration targeting >=90% recall.
# Rebuilt graphs and different datasets can change recall; measure it first.
# Replace /data/cohere paths and use the snapshot from cohere_build.yaml.
# Query/ground-truth text uses an ID followed by ';' and space-separated values.
# From the repository root:
#   ./build/bin/recall tools/core/bench/cohere_recall_bench.yaml
#   ./build/bin/bench tools/core/bench/cohere_recall_bench.yaml
# For comparable timing, use the same CPU affinity for both versions, select
# distinct physical cores, and keep other CPU-intensive jobs idle.
IndexCommon:
  IndexConfig: >-
    {"index_type":"kHNSW","data_type":"DT_FP32",
     "metric_type":"kCosine","dimension":768,
     "m":50,"ef_construction":500,
     "use_id_map":true,"use_quantized_graph":true}
  IndexPath: /data/cohere/cohere_full.index
  TopK: 10
  QueryFile: /data/cohere/cohere_test_vector_1m.1000.new.txt
  QueryFirstSep: ";"
  QuerySecondSep: " "
  QueryType: float
  RetrievalMode: dense
  FilterMode: none

  GroundTruthFile: /data/cohere/neighbors.txt
  GroundTruthFirstSep: ";"
  GroundTruthSecondSep: " "
  CompareById: true
  RecallThreadCount: 1
  RecallBatchCount: 0
  RecallGTCount: 10
  RecallLogDir: /data/cohere/recall_logs

  BenchThreadCount: 1
  BenchThreadCounts: [1, 8]
  BenchRounds: 5
  BenchSecs: 6
  BenchBatchCount: 1
  BenchIterCount: 1000000000
  LogLevel: info

# QueryParam is a JSON string. Do not add QueryParams unless intentionally
# running a sweep: that list overrides the single configuration below.
# route_beam=1 uses the embedded router; it does not train a missing router.
QueryConfig:
  QueryParam: >-
    {"index_type":"kHNSW","ef_search":64,
     "quantized_graph_margin":0.001,
     "quantized_graph_bucket_width":0.004,
     "quantized_graph_max_expansions":64,
     "quantized_graph_route_beam":1,
     "quantized_graph_uncertainty_bonus":0.15}
